syntax = "proto3";

// The scene streamer service definition.
service SceneStreamer {
	// Requests for a scene
	rpc RequestScene (SceneIndex) returns (stream Scene) {}
}

// The request message containing the scene index.
message SceneIndex {
	int32 sceneid = 1;
}

// The response message containing the list of assets/models
message Scene {
	bytes asset1 = 1;
	bytes asset2 = 2;
	bytes asset3 = 3;
	bytes asset4 = 4;
	bytes asset5 = 5; // List of all assets/models in the scene
}
